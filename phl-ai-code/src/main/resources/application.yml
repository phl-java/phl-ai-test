# Spring 核心配置
spring:
  # 应用基础配置
  application:
    name: yu-ai-code-mother-backend
  # 环境配置
  profiles:
    active: local
  # 自动配置排除（聚合到核心配置下）
  autoconfigure:
    exclude:
      - dev.langchain4j.community.store.embedding.redis.spring.RedisEmbeddingStoreAutoConfiguration
#      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

  # 数据源配置（MySQL）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_ai_code_mother
    username: root
    password: root

  # 数据存储配置（Redis）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0                    # Redis 数据库编号（默认 0，多库隔离数据）
      password:                      # Redis 密码（空表示无密码）
      ttl: 3600                      # 自定义过期时间：Redis 键默认过期 1 小时（秒）
      timeout: 15000ms               # 连接超时时间：15 秒（超时抛连接异常）
      lettuce:
        pool:
          max-active: 20             # 连接池最大活跃连接数：同时最多 20 个使用中
          max-idle: 10               # 连接池最大空闲连接数：最多 10 个空闲
          min-idle: 5                # 连接池最小空闲连接数：至少保留 5 个空闲
          max-wait: 5000ms           # 连接获取最大等待时间：5 秒（超时抛异常）

  # Session 后端配置
  session:
    store-type: redis
    timeout: 2592000                 # Session 超时时间：30天（秒）

# 服务器配置
server:
  port: 8123                         # 服务端口
  servlet:
    context-path: /api               # 接口根路径
    session:
      cookie:
        max-age: 2592000             # Session Cookie 过期时间：30天（秒）

# 接口文档配置（第三方扩展）
# springdoc-openapi 基础配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.phl.phlaicode.controller

# knife4j 增强配置
knife4j:
  enable: true                       # 启用knife4j增强
  setting:
    language: zh_cn                  # 接口文档语言：简体中文

